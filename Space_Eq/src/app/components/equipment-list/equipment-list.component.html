<section class="list-card" aria-label="Lista ekwipunku">
  <h2>Lista przedmiotow</h2>

  <div class="add-row">
    <label for="new-item">Nowy przedmiot</label>

    <input
      id="new-item"
      name="new-item"
      [(ngModel)]="newItemName"
      placeholder="no wsmunie nwm dodaj co chcesz"
    />
    <button type="button" (click)="addItem()">Dodaj</button>
  </div>
<!-- zssynchro inputa ze zmienna -->
  <p class="live-preview">Podglad: {{ newItemName || '...' }}</p>

  <ul>
    @for (item of equipment(); track item.id) {
      <li>
        <!-- dane do dzi - @Input(). -->
        <app-equipment-item [item]="item" (packedToggle)="togglePacked($event)" />
      </li>
    }
  </ul>
</section>
